name: kemt_app
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

# Flutter-specific configuration
flutter:
  uses-material-design: true

  # Assets (تأكد إن الملف موجود بالمسار بالظبط images/logo.jpeg)
  assets:
    - images/logo.jpeg

# Configuration for flutter_launcher_icons (موجود على مستوى الجذر - خارج قسم flutter)
flutter_icons:
  android: true
  ios: true
  image_path: "images/logo.jpeg"